  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; overflow: hidden; background: #e9ecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

    /* Обертка маркера отдела */
    .marker-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }

    /* Название отдела над маркером */
    .marker-label {
      background: rgba(255, 255, 255, 0.95);
      color: #1f2937;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      white-space: nowrap;
      margin-bottom: 5px;
      border: 1px solid rgba(0,0,0,0.08);
      pointer-events: none;
    }

    /* Пульсирующая круглая синяя метка */
    .pulse-pin {
      width: 22px; height: 22px;
      background: #007aff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      position: relative;
      cursor: pointer;
    }
    .pulse-pin::after {
      content: '';
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border: 2px solid #007aff;
      border-radius: 50%;
      animation: pulse-anim 1.8s infinite ease-out;
      pointer-events: none;
    }
    @keyframes pulse-anim {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .marker-wrapper.active-highlight .pulse-pin {
      background: #ff9500 !important;
      transform: scale(1.25);
    }
    .marker-wrapper.active-highlight .marker-label {
      background: #ff9500;
      color: #fff;
    }

    /* Зеленый маркер "Мое местоположение" с эффектом радара */
    .user-marker-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      z-index: 1000 !important;
      pointer-events: none;
    }
    .user-marker-label {
      background: #10b981;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.45);
      white-space: nowrap;
      margin-bottom: 6px;
      border: 1.5px solid #ffffff;
    }
    .user-pin {
      width: 22px; height: 22px;
      background: #10b981;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #10b981, 0 3px 10px rgba(0,0,0,0.35);
      position: relative;
    }
    .user-pin::after {
      content: '';
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      border: 3px solid #10b981;
      border-radius: 50%;
      animation: user-radar 2s infinite ease-out;
    }
    @keyframes user-radar {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Верхняя панель */
    #top-bar {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: flex; flex-direction: column; gap: 8px;
      max-width: 620px; margin: 0 auto;
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    
    input, select, button, textarea {
      font-size: 14px; padding: 7px 11px; border-radius: 7px; border: 1px solid #ccd0d5; outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: #007aff; }
    button { background: #007aff; color: #fff; border: none; cursor: pointer; font-weight: 500; }
    button:hover { background: #0056b3; }
    button.btn-gray { background: #6c757d; }
    button.btn-gray:hover { background: #5a6268; }
    button.btn-danger { background: #ff3b30; }
    button.btn-danger:hover { background: #d32f2f; }
    button.btn-success { background: #34c759; }

    /* Поиск отделов */
    #search-box { width: 100%; display: flex; }
    #search-input { flex: 1; }

    /* Панель редактора (видна только при ?admin=1) */
    #admin-panel {
      display: none; border-top: 1px solid #eee; padding-top: 8px;
      flex-direction: column; gap: 6px;
    }
    .admin-buttons { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Нижняя карточка отдела */
    /* Карточка отдела: два уровня открытия */

#bottom-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1001;

  background: #fff;
  border-radius: 18px 18px 0 0;
  padding: 20px;

  max-width: 480px;
  width: 100%;
  margin: 0 auto;

  height: 280px;
  max-height: 85dvh;

  overflow-y: auto;
  overscroll-behavior: contain;

  transform: translateY(110%);
  visibility: hidden;

  transition:
    transform 0.3s ease,
    height 0.3s ease,
    visibility 0.3s;

  box-shadow: 0 -6px 24px rgba(0,0,0,0.18);
}

/* Первое открытие — небольшая карточка */

#bottom-sheet.open {
  transform: translateY(0);
  visibility: visible;
}

/* Полное открытие */

#bottom-sheet.expanded {
  height: 85dvh;
}

/* Стрелка переключения */

.sheet-expand-btn {
  float: right;
  background: #f1f3f5;
  color: #333;
  border: none;
  border-radius: 50%;

  width: 34px;
  height: 34px;
  padding: 0;

  font-size: 20px;
  cursor: pointer;
}

.sheet-expand-btn:hover {
  background: #e0e4e8;
}

    /* Модальное окно */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1999; }
    .modal-box {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #fff; border-radius: 14px; padding: 22px; width: 92%; max-width: 380px;
      z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 18px; }
    .modal-box label { display: block; font-size: 12px; color: #666; margin-top: 8px; margin-bottom: 3px; }
    .modal-box input, .modal-box textarea { width: 100%; }
    .modal-footer { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
    #sheet-images {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}


#sheet-images img {
  width:100%;
  aspect-ratio:1 / 1;
  object-fit:cover;
  border-radius:14px;
}
  </style>
</head>

>

  <script>

"https://hwabjfrqbjakljmvabvj.supabase.co";

    // 1. Ваша база данных с реальными координатами и размерами

    // База IndexedDB для пользовательских правок
    const idb = {
      db: null,
      init() {
        return new Promise((resolve) => {
          const req = indexedDB.open("StoreMapsDB_V3", 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("images")) db.createObjectStore("images");
          };
          req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
        });
      },
      setImage(key, dataUrl) {
        return new Promise((resolve) => {
          const tx = this.db.transaction("images", "readwrite");
          tx.objectStore("images").put(dataUrl, key);
          tx.oncomplete = () => resolve();
        });
      },
      getImage(key) {
        return new Promise((resolve) => {
          const tx = this.db.transaction("images", "readonly");
          const req = tx.objectStore("images").get(key);
          req.onsuccess = () => resolve(req.result);
        });
      },
      deleteImage(key) {
        return new Promise((resolve) => {
          const tx = this.db.transaction("images", "readwrite");
          tx.objectStore("images").delete(key);
          tx.oncomplete = () => resolve();
        });
      }
    };

    let STORES = {};

let currentStoreId = "central";

let isEditMode = false;
let isPickingQrPoint = false;
let map = null;
let imageLayer = null;
let markerInstances = [];
let userMarkerInstance = null;
let editingMarkerId = null;
let userLocation = null;
// ===============================
// Загрузка данных из Supabase
// ===============================

async function loadStoreFromSupabase(){
  console.log("Текущий магазин:", currentStoreId);
  const { data: store, error } = await supabaseClient
    .from('stores')
    .select('*')
    .eq('id', currentStoreId)
    .single();


  if(error){

    console.error(
      "Ошибка загрузки магазина:",
      JSON.stringify(error, null, 2)
    );

    return null;

  }


  const { data: departments, error: depError } = await supabaseClient
    .from('departments')
    .select('*')
    .eq('store_id', currentStoreId);


  if(depError){

    console.error(
      "Ошибка загрузки отделов:",
      JSON.stringify(depError, null, 2)
    );

    return null;

  }


  store.markers = await Promise.all(

    departments.map(async (dep)=>{

      const images = await loadDepartmentImages(dep.id);


      return {

        id: dep.id,

        title: dep.title,

        desc: dep.description || "",

        promo: dep.promo || "",

        images: images,

        x: dep.x,

        y: dep.y

      };

    })

  );


  return store;

}
    async function updateDepartmentPosition(id, x, y){

  const { error } = await supabaseClient
    .from('departments')
    .update({
      x: x,
      y: y
    })
    .eq('id', id);


  if(error){

    console.error(
      "Ошибка сохранения координат:",
      error
    );

    return false;

  }


  console.log(
    "Координаты сохранены:",
    id,
    x,
    y
  );

  return true;

}
    async function loadDepartmentImages(departmentId){

  const {data,error}=await supabaseClient
    .from('department_images')
    .select('*')
    .eq('department_id', departmentId)
    .order('sort_order');


  if(error){

    console.error(error);
    return [];

  }


  return data.map(img=>img.url);

}

    function saveManifest() {
      localStorage.setItem('stores_network_saved_v3', JSON.stringify(STORES));
    }

    async function initApp() {
      await idb.init();

      const params = new URLSearchParams(window.location.search);
      
      // Доступ к редактору только по ?admin=1
      if (params.get('admin') === '1') {
        document.getElementById('admin-toggle-wrapper').style.display = 'flex';
      }

      
// Выбор филиала

const storeParam = params.get('store');

if (storeParam) {

  currentStoreId = storeParam;

} else {

  currentStoreId = "central";

}

      // Координаты точки "Вы здесь" из QR: ?pos=X,Y
      const posParam = params.get('pos');
      if (posParam) {
        const parts = posParam.split(',');
        if (parts.length === 2) {
          userLocation = {
            x: parseFloat(parts[0]),
            y: parseFloat(parts[1])
          };
        }
      }

      updateStoreSelect();

const supabaseStore = await loadStoreFromSupabase();

if(supabaseStore){

  STORES[currentStoreId] = supabaseStore;

}

updateStoreSelect();

loadMap();
    }

    function updateStoreSelect() {
      const select = document.getElementById('store-select');
      select.innerHTML = '';
      for (const id in STORES) {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = STORES[id].name;
        if (id === currentStoreId) opt.selected = true;
        select.appendChild(opt);
      }
    }

    async function loadMap() {
      if (map) map.remove();

      map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -2.5,
        maxZoom: 1.5,
        zoomSnap: 0.1,
        attributionControl: false
      });

      const store = STORES[currentStoreId];
      
      // Сначала проверяем сохраненную картинку, иначе берем fon.png
      let imgSrc = await idb.getImage("img_" + currentStoreId);
      if (!imgSrc) {
        imgSrc = store.image || "fon.png";
      }

            // Определяем реальные размеры фоновой карты
      const img = new Image();

      img.onload = function() {

        store.width = img.naturalWidth;
        store.height = img.naturalHeight;

        const bounds = [
          [0, 0],
          [store.height, store.width]
        ];

        // Показываем вертикальную схему магазина
        imageLayer = L.imageOverlay(imgSrc, bounds).addTo(map);

        map.fitBounds(bounds);

        // Возвращаем отображение меток
        renderMarkers();

        // Показываем точку "Моё местоположение"
        renderUserLocationMarker();
      };

      img.onerror = function() {
        console.error("Ошибка загрузки фоновой карты:", imgSrc);
      };

      img.src = imgSrc;

      // Клик по схеме
      map.on('click', (e) => {
        // Выбор точки для QR-кода
        if (isPickingQrPoint) {
          const clickX = Math.round(e.latlng.lng);
          const clickY = Math.round(e.latlng.lat);
          isPickingQrPoint = false;
          document.getElementById('admin-status').innerText = "Режим редактора: кликайте для отделов, перетаскивайте метки.";
          document.getElementById('admin-status').style.color = "#dc2626";

          const cleanUrl = window.location.origin + window.location.pathname + `?store=${currentStoreId}&pos=${clickX},${clickY}`;
          navigator.clipboard.writeText(cleanUrl).then(() => {
            alert(`✅ Ссылка с точкой "Мое местоположение" скопирована в буфер!\n\n${cleanUrl}\n\nСгенерируйте из неё QR-код и повесьте наклейку в этом месте.`);
          }).catch(() => {
            prompt("Скопируйте готовую ссылку для QR:", cleanUrl);
          });
          return;
        }

        // Добавление новой метки отдела в режиме редактора
        if (!isEditMode) return;
        const newMarker = {
          id: Date.now(),
          title: "Новый отдел",
          desc: "Описание отдела",
          promo: "",
          x: Math.round(e.latlng.lng),
          y: Math.round(e.latlng.lat)
        };
        STORES[currentStoreId].markers.push(newMarker);
        saveManifest();
        renderMarkers();
        openEditModal(newMarker.id);
      });
    }

    function renderMarkers(highlightId = null) {
      markerInstances.forEach(m => map.removeLayer(m));
      markerInstances = [];

      const markers = STORES[currentStoreId].markers;

      markers.forEach((data) => {
        const isHighlight = data.id === highlightId;
        
        const iconHtml = `
          <div class="marker-wrapper ${isHighlight ? 'active-highlight' : ''}">
            <div class="marker-label">${escapeHtml(data.title)}</div>
            <div class="pulse-pin"></div>
          </div>
        `;

        const icon = L.divIcon({
          className: 'custom-leaflet-icon',
          html: iconHtml,
          iconSize: [0, 0],
          iconAnchor: [0, 0]
        });

        const marker = L.marker([data.y, data.x], {
          icon: icon,
          draggable: isEditMode
        }).addTo(map);

        let dragged = false;
        marker.on('dragstart', () => { dragged = true; });

        marker.on('dragend', (e) => {
          marker.on('dragend', async (e) => {

  const pos = e.target.getLatLng();


  data.y = Math.round(pos.lat);

  data.x = Math.round(pos.lng);


  await updateDepartmentPosition(
    data.id,
    data.x,
    data.y
  );


  setTimeout(() => {
    dragged = false;
  }, 120);

});

        marker.on('click', () => {
          if (dragged) return;
          if (isEditMode) {
            openEditModal(data.id);
          } else {
            openSheet(data);
          }
        });

        markerInstances.push(marker);
      });
    }

    function renderUserLocationMarker() {
      if (userMarkerInstance) {
        map.removeLayer(userMarkerInstance);
        userMarkerInstance = null;
      }

      if (!userLocation) return;

      const userIconHtml = `
        <div class="user-marker-wrapper">
          <div class="user-marker-label">📍 Мое местоположение</div>
          <div class="user-pin"></div>
        </div>
      `;

      const userIcon = L.divIcon({
        className: 'user-location-leaflet-icon',
        html: userIconHtml,
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      });

      userMarkerInstance = L.marker([userLocation.y, userLocation.x], {
        icon: userIcon,
        interactive: false
      }).addTo(map);

      // Плавный фокус на точку человека
      map.flyTo([userLocation.y, userLocation.x], -0.5, { duration: 0.8 });
    }

    function startQrPointPicker() {
      isPickingQrPoint = true;
      document.getElementById('admin-status').innerText = "👉 Кликните мышкой по карте в месте, где будет наклейка с QR-кодом!";
      document.getElementById('admin-status').style.color = "#10b981";
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    function changeStore(storeId) {
      currentStoreId = storeId;
      userLocation = null;
      closeSheet();
      closeModals();
      loadMap();
    }

    function toggleEditMode(enabled) {
      isEditMode = enabled;
      isPickingQrPoint = false;
      document.getElementById('admin-panel').style.display = enabled ? 'flex' : 'none';
      closeSheet();
      renderMarkers();
    }

    async function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const dataUrl = event.target.result;
        const img = new Image();
        img.onload = async function() {
          STORES[currentStoreId].width = this.naturalWidth;
          STORES[currentStoreId].height = this.naturalHeight;
          saveManifest();
          await idb.setImage("img_" + currentStoreId, dataUrl);
          loadMap();
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(file);
    }

    function openEditModal(markerId) {
      editingMarkerId = markerId;
      const marker = STORES[currentStoreId].markers.find(m => m.id === markerId);
      if (!marker) return;

      document.getElementById('marker-title').value = marker.title;
      document.getElementById('marker-desc').value = marker.desc;
      document.getElementById('marker-promo').value = marker.promo;

      document.getElementById('marker-modal').style.display = 'block';
      document.getElementById('overlay').style.display = 'block';
    }

    function closeModals() {
      document.getElementById('marker-modal').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
      editingMarkerId = null;
    }

    function saveMarker() {
      const marker = STORES[currentStoreId].markers.find(m => m.id === editingMarkerId);
      if (marker) {
        marker.title = document.getElementById('marker-title').value.trim() || "Отдел";
        marker.desc = document.getElementById('marker-desc').value.trim();
        marker.promo = document.getElementById('marker-promo').value.trim();
        saveManifest();
        renderMarkers();
      }
      closeModals();
    }

    function deleteMarker() {
      STORES[currentStoreId].markers = STORES[currentStoreId].markers.filter(m => m.id !== editingMarkerId);
      saveManifest();
      renderMarkers();
      closeModals();
    }

    function openSheet(data) {
      document.getElementById('sheet-title').innerText = data.title;
      document.getElementById('sheet-desc').innerText = data.desc;
    const imagesEl =
document.getElementById('sheet-images');


imagesEl.innerHTML="";


if(data.images){


data.images.forEach(src=>{


const img=document.createElement("img");


img.src=getStorageUrl(src);


img.loading="lazy";


imagesEl.appendChild(img);


});


}
      const promoEl = document.getElementById('sheet-promo');
      if (data.promo) {
        promoEl.innerText = '🔥 ' + data.promo;
        promoEl.style.display = 'block';
      } else {
        promoEl.style.display = 'none';
      }
      // При выборе любого отдела карточка сначала свёрнута
const sheet = document.getElementById('bottom-sheet');
const expandBtn = document.getElementById('sheet-expand-btn');

sheet.classList.remove('expanded');
sheet.scrollTop = 0;

expandBtn.innerHTML = '&#9650;';
expandBtn.setAttribute('aria-expanded', 'false');
expandBtn.setAttribute('aria-label', 'Развернуть карточку');
      document.getElementById('bottom-sheet').classList.add('open');
      map.flyTo([data.y, data.x], map.getZoom() > -0.5 ? map.getZoom() : -0.5, { duration: 0.6 });
    }
    function toggleSheetExpand() {

  const sheet = document.getElementById('bottom-sheet');
  const btn = document.getElementById('sheet-expand-btn');

  const expanded = sheet.classList.toggle('expanded');

  btn.innerHTML = expanded ? '&#9660;' : '&#9650;';

  btn.setAttribute(
    'aria-expanded',
    String(expanded)
  );

  btn.setAttribute(
    'aria-label',
    expanded ? 'Свернуть карточку' : 'Развернуть карточку'
  );

  sheet.scrollTop = 0;
}

    function closeSheet() {

  const sheet = document.getElementById('bottom-sheet');

  sheet.classList.remove('open', 'expanded');
  sheet.scrollTop = 0;

  const btn = document.getElementById('sheet-expand-btn');

  btn.innerHTML = '&#9650;';
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-label', 'Развернуть карточку');
}

    function searchDepts(query) {
      query = query.toLowerCase().trim();
      if (!query) {
        renderMarkers();
        return;
      }
      const match = STORES[currentStoreId].markers.find(m => 
        m.title.toLowerCase().includes(query) || m.desc.toLowerCase().includes(query)
      );
      if (match) {
        renderMarkers(match.id);
        openSheet(match);
      }
    }

    function createNewStorePrompt() {
      const name = prompt("Название нового магазина (например: Филиал на Мира):");
      if (!name) return;
      const id = "store_" + Date.now();
      STORES[id] = { name: name, image: "fon.png", width: 4961, height: 3508, markers: [] };
      saveManifest();
      updateStoreSelect();
      changeStore(id);
    }

    function renameStorePrompt() {
      const newName = prompt("Новое название магазина:", STORES[currentStoreId].name);
      if (!newName) return;
      STORES[currentStoreId].name = newName;
      saveManifest();
      updateStoreSelect();
    }

    async function deleteStorePrompt() {
      if (Object.keys(STORES).length <= 1) {
        alert("Нельзя удалить единственный филиал.");
        return;
      }
      if (!confirm(`Удалить филиал «${STORES[currentStoreId].name}»?`)) return;

      await idb.deleteImage("img_" + currentStoreId);
      delete STORES[currentStoreId];
      saveManifest();
      currentStoreId = Object.keys(STORES)[0];
      updateStoreSelect();
      changeStore(currentStoreId);
    }

    function exportConfig() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(STORES, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = "stores_network_config.json";
      a.click();
    }

    initApp();
  </script>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; overflow: hidden; background: #e9ecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

    /* Обертка маркера отдела */
    .marker-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }

    /* Название отдела над маркером */
    .marker-label {
      background: rgba(255, 255, 255, 0.95);
      color: #1f2937;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      white-space: nowrap;
      margin-bottom: 5px;
      border: 1px solid rgba(0,0,0,0.08);
      pointer-events: none;
    }

    /* Пульсирующая круглая синяя метка */
    .pulse-pin {
      width: 22px; height: 22px;
      background: #007aff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      position: relative;
      cursor: pointer;
    }
    .pulse-pin::after {
      content: '';
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border: 2px solid #007aff;
      border-radius: 50%;
      animation: pulse-anim 1.8s infinite ease-out;
      pointer-events: none;
    }
    @keyframes pulse-anim {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .marker-wrapper.active-highlight .pulse-pin {
      background: #ff9500 !important;
      transform: scale(1.25);
    }
    .marker-wrapper.active-highlight .marker-label {
      background: #ff9500;
      color: #fff;
    }

    /* Зеленый маркер "Мое местоположение" с эффектом радара */
    .user-marker-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      z-index: 1000 !important;
      pointer-events: none;
    }
    .user-marker-label {
      background: #10b981;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.45);
      white-space: nowrap;
      margin-bottom: 6px;
      border: 1.5px solid #ffffff;
    }
    .user-pin {
      width: 22px; height: 22px;
      background: #10b981;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #10b981, 0 3px 10px rgba(0,0,0,0.35);
      position: relative;
    }
    .user-pin::after {
      content: '';
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      border: 3px solid #10b981;
      border-radius: 50%;
      animation: user-radar 2s infinite ease-out;
    }
    @keyframes user-radar {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }

async function adminLogin() {

  const email = document.getElementById("admin-email").value.trim();
  const password = document.getElementById("admin-password").value;
  const errorEl = document.getElementById("admin-login-error");

  errorEl.textContent = "";

  if (!email || !password) {
    errorEl.textContent = "Введите email и пароль.";
    return;
  }

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      errorEl.textContent = "Ошибка входа: " + error.message;
      return;

      await supabaseClient.auth.signOut();

    adminAuthorized = true;

        return new Promise((resolve) => {
          const req = indexedDB.open("StoreMapsDB_V3", 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("images")) db.createObjectStore("images");
          };
          req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
        });
      },
      setImage(key, dataUrl) {
        return new Promise((resolve) => {
          const tx = this.db.transaction("images", "readwrite");
          tx.objectStore("images").put(dataUrl, key);
          tx.oncomplete = () => resolve();
        });
      },
      getImage(key) {
        return new Promise((resolve) => {
          const tx = this.db.transaction("images", "readonly");
          const req = tx.objectStore("images").get(key);
          req.onsuccess = () => resolve(req.result);
        });
      },
      deleteImage(key) {
        return new Promise((resolve) => {
          const tx = this.db.transaction("images", "readwrite");
          tx.objectStore("images").delete(key);
          tx.oncomplete = () => resolve();
        });
      }
    };

async function loadStoresList() {

  const { data, error } = await supabaseClient
    .from("stores")
    .select("*")
    .order("name");

  if (error) {
    console.error("Ошибка загрузки магазинов:", error);
    throw error;
  }

  STORES = {};

  for (const store of data || []) {
    STORES[store.id] = {
      ...store,
      markers: []
    };
  }

  updateStoreSelect();

  return data || [];
}

async function loadStoreFromSupabase(){
  console.log("Текущий магазин:", currentStoreId);
  const { data: store, error } = await supabaseClient
    .from('stores')
    .select('*')
    .eq('id', currentStoreId)
    .single();


  if(error){

    console.error(
      "Ошибка загрузки магазина:",
      JSON.stringify(error, null, 2)
    );

    return null;

  }


  const { data: departments, error: depError } = await supabaseClient
    .from('departments')
    .select('*')
    .eq('store_id', currentStoreId);


  if(depError){

    console.error(
      "Ошибка загрузки отделов:",
      JSON.stringify(depError, null, 2)
    );

    return null;

  }


  store.markers = await Promise.all(

    departments.map(async (dep)=>{

      const images = await loadDepartmentImages(dep.id);


      return {

        id: dep.id,

        title: dep.title,

        desc: dep.description || "",

        promo: dep.promo || "",

        searchProducts: dep.search_products || "",

        images: images,

        x: dep.x,

        y: dep.y

      };

    })

  );


  return store;

}

// Загружаем фотографии в Supabase
async function uploadDepartmentPhotos(event) {

  const files = Array.from(event.target.files || []);

  const status =
    document.getElementById("admin-photo-status");

  if (!files.length) return;

  if (!adminAuthorized || !editingMarkerId) {
    alert("Необходимо войти как администратор.");
    event.target.value = "";
    return;
  }

  const departmentId = editingMarkerId;

  const marker = STORES[currentStoreId].markers.find(
    m => m.id === departmentId
  );

  if (!marker) {
    alert("Отдел не найден.");
    event.target.value = "";
    return;
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  let uploaded = 0;
  const errors = [];

  event.target.disabled = true;

  try {

    for (const file of files) {

      try {

        // Проверяем формат
        if (!allowedTypes.includes(file.type)) {
          throw new Error("Допустимы только JPG, PNG и WEBP");
        }

        // Ограничение на размер одного файла: 8 МБ
        if (file.size > 8 * 1024 * 1024) {
          throw new Error("Размер файла больше 8 МБ");
        }

        status.textContent =
          `Загружается ${uploaded + 1} из ${files.length}...`;

        // Уникальное имя для каждого изображения
        const extension =
          file.type === "image/png" ? "png" :
          file.type === "image/webp" ? "webp" : "jpg";

        const uniqueName =
          Date.now() + "_" +
          Math.random().toString(36).slice(2, 10) +
          "." + extension;

        const storagePath =
          "donetsk_stadionnaya_3d/departments/" +
          departmentId + "/" + uniqueName;

        // 1. Загружаем файл в Supabase Storage
        const { error: storageError } =
          await supabaseClient.storage
            .from("store-images")
            .upload(storagePath, file, {
              contentType: file.type,
              upsert: false
            });

        if (storageError) {
          throw storageError;
        }

        // 2. Привязываем изображение к отделу
        const { error: dbError } =
          await supabaseClient
            .from("department_images")
            .insert({
              department_id: departmentId,
              url: storagePath,
              sort_order: 0
            });

        if (dbError) {
          throw dbError;
        }

        // 3. Обновляем список фото на странице
        marker.images = marker.images || [];
        marker.images.push(storagePath);

        uploaded++;

        renderAdminDepartmentPhotos();

      } catch (error) {

        console.error("Ошибка загрузки фото:", error);

        errors.push(
          file.name + ": " + (error.message || "Ошибка")
        );

      }

    }

    status.textContent =
      `Загружено фотографий: ${uploaded} из ${files.length}`;

    if (errors.length) {

      alert(
        "Не все фотографии удалось загрузить:\n\n" +
        errors.join("\n")
      );

    }

  } finally {

    event.target.value = "";
    event.target.disabled = false;

  }

}

async function deleteDepartmentPhoto(path, button) {

  if (!adminAuthorized || !editingMarkerId) {
    alert("Необходимо войти как администратор.");
    return;
  }

  const departmentId = editingMarkerId;

  const marker = STORES[currentStoreId].markers.find(
    m => m.id === departmentId
  );

  if (!marker) {
    alert("Отдел не найден.");
    return;
  }

  const confirmed = confirm(
    "Удалить эту фотографию из отдела?\n\n" +
    "Она исчезнет с карты у всех покупателей."
  );

  if (!confirmed) return;

  const status =
    document.getElementById("admin-photo-status");

  button.disabled = true;
  status.textContent = "Удаление фотографии...";

  try {

    // 1. Удаляем привязку изображения к отделу
    const { data: deletedRows, error: dbError } =
      await supabaseClient
        .from("department_images")
        .delete()
        .eq("department_id", departmentId)
        .eq("url", path)
        .select("id");

    if (dbError) {
      throw dbError;
    }

    if (!deletedRows || deletedRows.length === 0) {
      throw new Error(
        "Запись фотографии не найдена или нет прав на удаление."
      );
    }

    // 2. Убираем фото из текущего отдела на странице
    marker.images = (marker.images || [])
      .filter(imgPath => imgPath !== path);

    renderAdminDepartmentPhotos();

    // 3. Проверяем, не используется ли файл в других отделах
    const { count, error: countError } =
      await supabaseClient
        .from("department_images")
        .select("id", {
          count: "exact",
          head: true
        })
        .eq("url", path);

    if (countError) {
      status.textContent =
        "Фото удалено из отдела. Проверить файл в Storage не удалось.";
      return;
    }

    // Физически удаляем файл, только если он больше
    // нигде не используется
    if (count === 0) {

      const { error: storageError } =
        await supabaseClient.storage
          .from("store-images")
          .remove([path]);

      if (storageError) {
        console.error(
          "Ошибка удаления файла из Storage:",
          storageError
        );

        status.textContent =
          "Фото удалено с карты, но файл остался в Storage: " +
          storageError.message;

        return;
      }

    }

    status.textContent = "Фотография удалена.";

  } catch (error) {

    console.error("Ошибка удаления фотографии:", error);

    status.textContent =
      "Ошибка удаления: " +
      (error.message || "Неизвестная ошибка");

    alert(
      "Не удалось удалить фотографию:\n\n" +
      (error.message || "Неизвестная ошибка")
    );

  } finally {

    button.disabled = false;

  }

}

async function handleImageUpload(event) {

  const file = event.target.files?.[0];

  if (!file) return;

  if (!adminAuthorized) {
    alert("Доступно только администратору.");
    event.target.value = "";
    return;
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if (!allowedTypes.includes(file.type)) {
    alert("Допустимы изображения JPG, PNG и WEBP.");
    event.target.value = "";
    return;
  }

  if (file.size > 15 * 1024 * 1024) {
    alert("Размер схемы не должен превышать 15 МБ.");
    event.target.value = "";
    return;
  }

  const storeId = currentStoreId;
  const store = STORES[storeId];

  const oldImage = store.image;

  let uploadedPath = null;

  try {

    // Определяем реальные размеры изображения
    const dimensions = await new Promise((resolve, reject) => {

      const image = new Image();
      const objectUrl = URL.createObjectURL(file);

      image.onload = () => {

        URL.revokeObjectURL(objectUrl);

        resolve({
          width: image.naturalWidth,
          height: image.naturalHeight
        });

      };

      image.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        reject(new Error("Не удалось прочитать изображение."));
      };

      image.src = objectUrl;

    });

    const extension =
      file.type === "image/png" ? "png" :
      file.type === "image/webp" ? "webp" : "jpg";

    const path =
      "store-maps/" +
      storeId + "/" +
      Date.now() + "_" +
      Math.random().toString(36).slice(2, 10) +
      "." + extension;

    // Загружаем новую фоновую схему
    const { error: uploadError } =
      await supabaseClient.storage
        .from("store-images")
        .upload(path, file, {
          contentType: file.type,
          upsert: false
        });

    if (uploadError) throw uploadError;

    uploadedPath = path;

    // Сохраняем путь и размеры в таблице stores
    const { data, error: dbError } =
      await supabaseClient
        .from("stores")
        .update({
          image: path,
          width: dimensions.width,
          height: dimensions.height
        })
        .eq("id", storeId)
        .select()
        .single();

    if (dbError) throw dbError;

    store.image = data.image;
    store.width = data.width;
    store.height = data.height;

    // Удаляем старую схему, только если она была
    // загружена через наш новый механизм
    if (oldImage?.startsWith("store-maps/" + storeId + "/")) {

      const { error: removeError } =
        await supabaseClient.storage
          .from("store-images")
          .remove([oldImage]);

      if (removeError) {
        console.warn(
          "Старую схему удалить не удалось:",
          removeError
        );
      }

    }

    await loadMap();

    alert("Схема магазина сохранена в Supabase.");

  } catch (error) {

    console.error("Ошибка загрузки схемы:", error);

    // Если файл загрузился, а БД не обновилась,
    // пытаемся удалить неиспользуемый файл
    if (uploadedPath && store.image !== uploadedPath) {

      await supabaseClient.storage
        .from("store-images")
        .remove([uploadedPath]);

    }

    alert(
      "Не удалось сохранить схему:\n" +
      (error.message || "Неизвестная ошибка")
    );

  } finally {

    event.target.value = "";

  }

}

    }

    async function saveMarker(){

  const marker = STORES[currentStoreId]
  .markers.find(m => m.id === editingMarkerId);


  if(marker){


    marker.title =
    document.getElementById('marker-title').value.trim();


    marker.desc =
    document.getElementById('marker-desc').value.trim();


    marker.promo =
    document.getElementById('marker-promo').value.trim();

    marker.searchProducts =
  document.getElementById("marker-search-products").value.trim();


    await updateDepartment(
      marker.id,
      marker
    );


    renderMarkers();

  }


  closeModals();

}

  async function deleteMarker() {

  if (!adminAuthorized) {
    alert("Удалять отделы может только администратор.");
    return;
  }

  const departmentId = editingMarkerId;

  if (departmentId == null) {
    alert("Отдел не выбран.");
    return;
  }

  const store = STORES[currentStoreId];

  const marker = store.markers.find(
    m => m.id === departmentId
  );

  if (!marker) {
    alert("Отдел не найден.");
    return;
  }

  const confirmed = confirm(
    `Удалить отдел «${marker.title}»?\n\n` +
    "Метка, описание, акции и фотографии исчезнут с карты у всех покупателей.\n\n" +
    "Это действие нельзя отменить."
  );

  if (!confirmed) return;

  try {

    // 1. Сначала удаляем привязки фотографий
    const { error: imagesError } =
      await supabaseClient
        .from("department_images")
        .delete()
        .eq("department_id", departmentId);

    if (imagesError) {
      throw new Error(
        "Не удалось удалить связи с фотографиями: " +
        imagesError.message
      );
    }

    // 2. Удаляем сам отдел из Supabase
    const { data: deleted, error: deleteError } =
      await supabaseClient
        .from("departments")
        .delete()
        .eq("id", departmentId)
        .eq("store_id", currentStoreId)
        .select("id");

    if (deleteError) {
      throw deleteError;
    }

    if (!deleted || deleted.length === 0) {
      throw new Error(
        "Supabase не подтвердил удаление отдела. Проверь права доступа."
      );
    }

    // 3. Убираем метку с карты
    store.markers = store.markers.filter(
      m => m.id !== departmentId
    );

    closeModals();
    closeSheet();
    renderMarkers();

    alert(`Отдел «${marker.title}» удалён.`);

  } catch (error) {

    console.error("Ошибка удаления отдела:", error);

    alert(
      "Не удалось удалить отдел:\n\n" +
      (error.message || "Неизвестная ошибка")
    );

  }

}

    function openSheet(data) {
      document.getElementById('sheet-title').innerText = data.title;
      document.getElementById('sheet-desc').innerText = data.desc;
    const imagesEl =
document.getElementById('sheet-images');


imagesEl.innerHTML="";


if(data.images){


data.images.forEach(src=>{


const img=document.createElement("img");


img.src=getStorageUrl(src);


img.loading="lazy";


imagesEl.appendChild(img);


});


}
      const promoEl = document.getElementById('sheet-promo');
      if (data.promo) {
        promoEl.innerText = '🔥 ' + data.promo;
        promoEl.style.display = 'block';

        promoEl.style.display = 'none';
      }
      // При выборе любого отдела карточка сначала свёрнута
const sheet = document.getElementById('bottom-sheet');
const expandBtn = document.getElementById('sheet-expand-btn');

sheet.classList.remove('expanded');
sheet.scrollTop = 0;

expandBtn.innerHTML = '&#9650;';
expandBtn.setAttribute('aria-expanded', 'false');
expandBtn.setAttribute('aria-label', 'Развернуть карточку');
      document.getElementById('bottom-sheet').classList.add('open');
      map.flyTo([data.y, data.x], map.getZoom() > -0.5 ? map.getZoom() : -0.5, { duration: 0.6 });
    }
    function toggleSheetExpand() {

  const sheet = document.getElementById('bottom-sheet');
  const btn = document.getElementById('sheet-expand-btn');

  const expanded = sheet.classList.toggle('expanded');

  btn.innerHTML = expanded ? '&#9660;' : '&#9650;';

  btn.setAttribute(
    'aria-expanded',
    String(expanded)
  );

  btn.setAttribute(
    'aria-label',
    expanded ? 'Свернуть карточку' : 'Развернуть карточку'
  );

  sheet.scrollTop = 0;
}

    function closeSheet() {

  const sheet = document.getElementById('bottom-sheet');

  sheet.classList.remove('open', 'expanded');
  sheet.scrollTop = 0;

  const btn = document.getElementById('sheet-expand-btn');

  btn.innerHTML = '&#9650;';
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-label', 'Развернуть карточку');
}

    // =====================================
// УМНЫЙ ПОИСК ТОВАРОВ И ОТДЕЛОВ
// =====================================

function normalizeSearch(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/ё/g, "е")
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function searchDepts(query) {

  const normalizedQuery = normalizeSearch(query);

  if (!normalizedQuery) {
    renderMarkers();
    closeSheet();
    return;
  }

  const store = STORES[currentStoreId];

  if (!store || !Array.isArray(store.markers)) return;

  const matches = store.markers.filter(marker => {

    // Все поля, по которым разрешён поиск
    const searchText = normalizeSearch([
      marker.title,
      marker.desc,
      marker.searchProducts
    ].join(" "));

    // Каждое слово запроса должно присутствовать
    const words = normalizedQuery.split(" ");

    return words.every(word => searchText.includes(word));

  });

  if (matches.length === 0) {
    renderMarkers();
    closeSheet();
    return;
  }

  // Выбираем наиболее подходящий отдел
  const bestMatch = matches[0];

  // Подсвечиваем найденную метку
  renderMarkers(bestMatch.id);

  // Приближаем карту и открываем карточку
  openSheet(bestMatch);

}

async function createNewStorePrompt() {

  if (!adminAuthorized) {
    alert("Доступно только администратору.");
    return;
  }

  const name = prompt(
    "Название нового магазина:\nНапример: г. Донецк, проспект Ильича, 23Д"
  );

  if (!name || !name.trim()) return;

  const storeId = "store_" + Date.now();

  const { data, error } = await supabaseClient
    .from("stores")
    .insert({
      id: storeId,
      name: name.trim(),
      image: "fon.png",
      width: 3508,
      height: 4961
    })
    .select()
    .single();

  if (error) {

    console.error("Ошибка создания магазина:", error);

    alert(
      "Не удалось создать магазин:\n" +
      error.message
    );

    return;
  }

  STORES[data.id] = {
    ...data,
    markers: []
  };

  updateStoreSelect();

  await changeStore(data.id);

  alert(
    "Магазин создан в Supabase.\n\n" +
    "Теперь нажми «Сменить картинку» и загрузи схему нового магазина."
  );

}

    // =====================================
// УДАЛЕНИЕ МАГАЗИНА ИЗ SUPABASE
// =====================================

async function deleteStorePrompt() {

  if (!adminAuthorized) {
    alert("Доступно только администратору.");
    return;
  }

  const storeIds = Object.keys(STORES);

  if (storeIds.length <= 1) {
    alert("Нельзя удалить единственный магазин.");
    return;
  }

  const storeId = currentStoreId;
  const store = STORES[storeId];

  const confirmed = confirm(
    `Удалить магазин «${store.name}»?\n\n` +
    "Все его отделы, метки, описания, акции и " +
    "привязки фотографий будут удалены.\n\n" +
    "Операция необратима."
  );

  if (!confirmed) return;

  try {

    const { data, error } = await supabaseClient
      .rpc("admin_delete_store", {
        p_store_id: storeId
      });

    if (error) throw error;

    if (data !== true) {
      throw new Error("Supabase не подтвердил удаление.");
    }

    // Удаляем фоновую схему после успешного удаления
    // магазина из базы
    if (store.image?.startsWith("store-maps/" + storeId + "/")) {

      const { error: storageError } =
        await supabaseClient.storage
          .from("store-images")
          .remove([store.image]);

      if (storageError) {
        console.warn(
          "Магазин удалён, но фоновая схема осталась:",
          storageError
        );
      }

    }

    // Удаляем магазин из списка в браузере
    delete STORES[storeId];

    const nextStoreId = Object.keys(STORES)[0];

    await changeStore(nextStoreId);

    alert("Магазин удалён из Supabase.");

  } catch (error) {

    console.error("Ошибка удаления магазина:", error);

    alert(
      "Не удалось удалить магазин:\n" +
      (error.message || "Неизвестная ошибка")
    );

  }

}
